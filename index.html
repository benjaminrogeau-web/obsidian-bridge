<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouverture dans Obsidian…</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 12px;
      padding: 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.2rem; margin: 0 0 12px; color: #a882ff; }
    p { font-size: 0.9rem; color: #b0b0b0; line-height: 1.4; margin: 0 0 20px; }
    .meta {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 0.8rem;
      text-align: left;
      color: #9cdcfe;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .btn {
      display: block;
      background: #7c3aed;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 1rem;
    }
    .btn:active { background: #6d28d9; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Redirection vers Obsidian…</h1>
    <p id="desc">Si Obsidian ne s'ouvre pas automatiquement, appuyez sur le bouton ci-dessous.</p>
    <div class="meta" id="preview">Lecture des paramètres…</div>
    <a id="open-btn" class="btn" href="#">Ouvrir dans Obsidian</a>
  </div>

  <script>
    (function () {
      const rawSearch = window.location.search;
      const previewEl = document.getElementById("preview");
      const btnEl = document.getElementById("open-btn");
      const titleEl = document.getElementById("title");
      const descEl = document.getElementById("desc");

      if (!rawSearch || rawSearch.length < 2) {
        titleEl.textContent = "Aucun paramètre détecté";
        titleEl.classList.add("error");
        descEl.textContent = "Cette page attend des paramètres Advanced URI (ex. ?vault=...&filepath=...).";
        previewEl.textContent = "URL vide";
        btnEl.style.display = "none";
        return;
      }

      const obsidianUri = "obsidian://advanced-uri" + rawSearch;
      btnEl.href = obsidianUri;

      const params = new URLSearchParams(rawSearch);
      const vault = params.get("vault") || "(défaut)";
      const target = params.get("filepath") || params.get("filename") || params.get("commandid") || "(action)";
      const heading = params.get("heading") ? " - #" + params.get("heading") : "";
      const mode = params.get("mode") || "open";
      previewEl.textContent = `Coffre : ${vault}\nCible  : ${target}${heading}\nMode   : ${mode}`;

      window.location.replace(obsidianUri);
    })();
  </script>
</body>
</html>
